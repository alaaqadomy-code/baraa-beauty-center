name: fetch-instagram-photos
on:
  push:
    branches: [fetch-photos]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p raw/img
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          n=0
          while read u; do
            [ -z "$u" ] && continue; n=$((n+1)); f=$(printf "raw/img/p%02d.jpg" $n)
            # direct Instagram CDN: https://<_nc_ht>/v/<t51...>/<file>?<rest>
            q="${u#*\?}"; path="${q%%\?*}"; rest="${q#*\?}"
            host=$(echo "$rest" | grep -oE '_nc_ht=[^&]+' | cut -d= -f2)
            cdn="https://$host/v/$path?$rest"
            curl -sSL -A "$UA" "$cdn" -o "$f" -w "$n cdn %{http_code} %{content_type}\n" || true
            if ! file "$f" | grep -q JPEG; then curl -sSL -A "$UA" -e https://imginn.com/ "$u" -o "$f" -w "$n imginn %{http_code} %{content_type}\n" || true; fi
          done < raw/urls_in.txt
          file raw/img/* || true
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add raw && git commit -m "Fetched Instagram photos" && git push || echo nothing
